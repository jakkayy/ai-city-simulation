name: CD

# Deploys to the home server through a self-hosted runner (no inbound ports needed).
# Runs only after CI succeeded on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to home server
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    env:
      # secrets + COMPOSE_PROJECT_NAME live in this file on the server (never in the repo)
      ENV_FILE: ${{ vars.ENV_FILE || format('{0}/ai-city.env', github.workspace) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and start containers
        run: |
          set -e
          test -f "$ENV_FILE" || { echo "Missing env file: $ENV_FILE"; exit 1; }
          docker compose --env-file "$ENV_FILE" up -d --build --remove-orphans

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost/api/health; then
              echo; echo "Backend healthy"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 5
          done
          echo "Backend did not become healthy"
          docker compose --env-file "$ENV_FILE" logs --tail=50 backend
          exit 1

      - name: Status
        run: docker compose --env-file "$ENV_FILE" ps
