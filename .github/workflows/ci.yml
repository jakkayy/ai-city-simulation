name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://aicity:aicity_dev@localhost:5432/aicity_db
      GROQ_API_KEY_1: ""
      GROQ_API_KEY_2: ""
      GROQ_API_KEY_3: ""
      ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aicity
          POSTGRES_PASSWORD: aicity_dev
          POSTGRES_DB: aicity_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        run: PYTHONPATH=. alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  lint-frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
