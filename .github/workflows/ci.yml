name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://aicity:aicity_dev@localhost:5432/aicity_db
      GROQ_API_KEY_1: ""
      GROQ_API_KEY_2: ""
      GROQ_API_KEY_3: ""
      ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aicity
          POSTGRES_PASSWORD: aicity_dev
          POSTGRES_DB: aicity_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        run: PYTHONPATH=. alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  lint-frontend:
    name: Frontend (type-check, lint, tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  notify:
    name: Discord notification
    runs-on: ubuntu-latest
    needs: [test, lint-frontend]
    if: ${{ always() }}
    continue-on-error: true       # a Discord outage must never turn CI red
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The webhook URL is the repository secret DISCORD_WEBHOOK_URL. It is empty on pull requests
      # from forks and on Dependabot runs; the script then skips quietly.
      # Commit messages and PR titles are passed as environment variables, never pasted into the script.
      - name: Post the result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BACKEND_RESULT: ${{ needs.test.result }}
          FRONTEND_RESULT: ${{ needs.lint-frontend.result }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: bash scripts/notify-discord.sh
